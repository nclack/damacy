name: cpu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config liburing-dev libzstd-dev libblosc-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config zstd c-blosc
      - name: Install Python dependencies
        run: python -m pip install uv pytest pytest-cov numpy
      - name: Build without CUDA
        run: |
          cmake --preset cpu -DDAMACY_PYTHON=ON -DPython_EXECUTABLE="$(command -v python)" -DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=ON
          cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180 -j2
      - name: Check native dependencies
        env:
          PYTHONPATH: build/python
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from damacy import _native
          assert not _native.CUDA_ENABLED
          command = ['otool', '-L'] if sys.platform == 'darwin' else ['ldd']
          dependencies = subprocess.check_output([*command, _native.__file__], text=True).lower()
          if sys.platform == 'darwin':
              assert 'liburing' not in dependencies
          print(dependencies)
          assert all(name not in dependencies for name in ('libcuda', 'libcudart', 'libnvcomp'))
          PY
